[package]
name = "journey-notes"
version = "0.1.0"
description = "Local-first desktop notebook organised around Journeys and timelines"
edition = "2021"
rust-version = "1.77"
default-run = "journey-notes"

[lib]
name = "journey_notes_lib"
crate-type = ["lib"]

[[bin]]
name = "journey-notes"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
base64 = "0.22"
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg", "webp"] }
kamadak-exif = "0.6"

[features]
# Enabled by `tauri build --debug`; keeps devtools available in debug bundles.
default = []
# Opt in only in a working copy that contains the ignored local-tests directory.
local-tests = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
